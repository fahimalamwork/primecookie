name: Build check

# The live site is served straight from main by GitHub Pages ("Deploy from a branch", main, / (root)),
# so nothing is deployed here. This just makes sure the Vite build still passes.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
